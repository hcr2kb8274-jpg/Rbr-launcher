name: Build Android TV APK

on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/racing/rbrlauncher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RBRLauncher"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.racing.rbrlauncher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.racing.rbrlauncher"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="RBR Launcher"
                  android:theme="@style/Theme.RBRLauncher"
                  android:banner="@drawable/banner_f1">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/racing/rbrlauncher/MainActivity.kt
          package com.racing.rbrlauncher
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.View
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {
              private lateinit var tvClock: TextView
              private lateinit var tvDate: TextView
              private val handler = Handler(Looper.getMainLooper())
              private val timeRunnable = object : Runnable {
                  override fun run() {
                      val now = Date()
                      tvClock.text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(now)
                      tvDate.text = SimpleDateFormat("EEE, d MMM", Locale.getDefault()).format(now)
                      handler.postDelayed(this, 1000)
                  }
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  tvClock = findViewById(R.id.tvClock)
                  tvDate = findViewById(R.id.tvDate)
                  setupAppCard(R.id.cardRutube, listOf("ru.rutube.tv", "ru.rutube.app"))
                  setupAppCard(R.id.cardVk, listOf("com.vk.vkclient", "com.vkontakte.android"))
                  setupAppCard(R.id.cardKinopoisk, listOf("ru.kinopoisk.tv", "ru.kinopoisk"))
                  setupAppCard(R.id.cardYoutube, listOf("com.google.android.youtube.tv", "com.google.android.youtube"))
                  setupAppCard(R.id.cardIncy, listOf("com.incy.vpn", "com.incy"))
                  findViewById<View>(R.id.cardRutube).requestFocus()
              }
              override fun onResume() { super.onResume(); handler.post(timeRunnable) }
              override fun onPause() { super.onPause(); handler.removeCallbacks(timeRunnable) }
              private fun setupAppCard(viewId: Int, packageIds: List<String>) {
                  findViewById<View>(viewId).setOnClickListener {
                      var launched = false
                      for (pkg in packageIds) {
                          val intent = packageManager.getLaunchIntentForPackage(pkg)
                          if (intent != null) { startActivity(intent); launched = true; break }
                      }
                      if (!launched) {
                          Toast.makeText(this, "Открываю настройки...", Toast.LENGTH_SHORT).show()
                          try { startActivity(Intent(Settings.ACTION_APPLICATION_SETTINGS)) } catch (e: Exception) {}
                      }
                  }
              }
              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {}
          }
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#07090E"
              android:orientation="vertical"
              android:padding="32dp">
              <RelativeLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="16dp">
                  <TextView
                      android:id="@+id/tvTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="RED BULL RACING // TV"
                      android:textColor="#FFCC00"
                      android:textSize="20sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/tvClock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentEnd="true"
                      android:text="12:00"
                      android:textColor="#FFFFFF"
                      android:textSize="32sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/tvDate"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_below="@id/tvClock"
                      android:layout_alignParentEnd="true"
                      android:text="01.01.2024"
                      android:textColor="#8F9CAE"
                      android:textSize="14sp" />
              </RelativeLayout>
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="120dp"
                  android:background="@drawable/banner_f1"
                  android:layout_marginBottom="24dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|start"
                      android:layout_margin="16dp"
                      android:text="FORMULA 1 RACING HUB"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="italic|bold" />
              </FrameLayout>
              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none">
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <FrameLayout android:id="@+id/cardRutube" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="RUTUBE" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardVk" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="VK VIDEO" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardKinopoisk" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="КИНОПОИСК" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardYoutube" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="YOUTUBE" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardIncy" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="INCY VPN" android:textColor="#FFCC00" android:textStyle="bold" />
                      </FrameLayout>
                  </LinearLayout>
              </HorizontalScrollView>
          </LinearLayout>
          EOF

          # card_focus_selector.xml
          cat << 'EOF' > app/src/main/res/drawable/card_focus_selector.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#222B38" />
                      <stroke android:width="3dp" android:color="#EA0029" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#141824" />
                      <stroke android:width="1dp" android:color="#333C4E" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
          </selector>
          EOF

          # banner_f1.xml
          cat << 'EOF' > app/src/main/res/drawable/banner_f1.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="45" android:startColor="#0A0E17" android:centerColor="#151D2A" android:endColor="#EA0029" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.RBRLauncher" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#07090E</item>
              </style>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedBullRacingLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
