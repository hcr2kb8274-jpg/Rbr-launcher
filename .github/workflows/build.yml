name: Build Android TV APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/racing/rbrlauncher
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "RBRLauncher"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.racing.rbrlauncher'
              compileSdk 34
              defaultConfig {
                  applicationId "com.racing.rbrlauncher"
                  minSdk 28
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:label="RBR Launcher"
                  android:theme="@style/Theme.RBRLauncher"
                  android:banner="@drawable/banner_f1">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat << 'EOF' > app/src/main/java/com/racing/rbrlauncher/MainActivity.java
          package com.racing.rbrlauncher;

          import android.content.Intent;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import java.text.SimpleDateFormat;
          import java.util.Arrays;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {
              private TextView tvClock;
              private TextView tvDate;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private final Runnable timeRunnable = new Runnable() {
                  @Override
                  public void run() {
                      Date now = new Date();
                      tvClock.setText(new SimpleDateFormat("HH:mm", Locale.getDefault()).format(now));
                      tvDate.setText(new SimpleDateFormat("EEE, d MMM", Locale.getDefault()).format(now));
                      handler.postDelayed(this, 1000);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvClock = findViewById(R.id.tvClock);
                  tvDate = findViewById(R.id.tvDate);

                  setupAppCard(R.id.cardRutube, Arrays.asList("ru.rutube.tv", "ru.rutube.app"));
                  setupAppCard(R.id.cardVk, Arrays.asList("com.vk.vkclient", "com.vkontakte.android"));
                  setupAppCard(R.id.cardKinopoisk, Arrays.asList("ru.kinopoisk.tv", "ru.kinopoisk"));
                  setupAppCard(R.id.cardYoutube, Arrays.asList("com.google.android.youtube.tv", "com.google.android.youtube"));
                  setupAppCard(R.id.cardIncy, Arrays.asList("com.incy.vpn", "com.incy"));

                  View firstCard = findViewById(R.id.cardRutube);
                  if (firstCard != null) firstCard.requestFocus();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  handler.post(timeRunnable);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(timeRunnable);
              }

              private void setupAppCard(int viewId, List<String> packageIds) {
                  View v = findViewById(viewId);
                  if (v == null) return;
                  v.setOnClickListener(view -> {
                      boolean launched = false;
                      for (String pkg : packageIds) {
                          Intent intent = getPackageManager().getLaunchIntentForPackage(pkg);
                          if (intent != null) {
                              startActivity(intent);
                              launched = true;
                              break;
                          }
                      }
                      if (!launched) {
                          Toast.makeText(MainActivity.this, "Приложение не найдено", Toast.LENGTH_SHORT).show();
                          try {
                              startActivity(new Intent(Settings.ACTION_APPLICATION_SETTINGS));
                          } catch (Exception ignored) {}
                      }
                  });
              }

              @Override
              public void onBackPressed() {
                  // Блокировка выхода по Back (Launcher)
              }
          }
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#07090E"
              android:orientation="vertical"
              android:padding="32dp">
              <RelativeLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="16dp">
                  <TextView
                      android:id="@+id/tvTitle"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="RED BULL RACING // TV"
                      android:textColor="#FFCC00"
                      android:textSize="20sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/tvClock"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentEnd="true"
                      android:text="12:00"
                      android:textColor="#FFFFFF"
                      android:textSize="32sp"
                      android:textStyle="bold" />
                  <TextView
                      android:id="@+id/tvDate"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_below="@id/tvClock"
                      android:layout_alignParentEnd="true"
                      android:text="01.01.2024"
                      android:textColor="#8F9CAE"
                      android:textSize="14sp" />
              </RelativeLayout>
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="120dp"
                  android:background="@drawable/banner_f1"
                  android:layout_marginBottom="24dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|start"
                      android:layout_margin="16dp"
                      android:text="FORMULA 1 RACING HUB"
                      android:textColor="#FFFFFF"
                      android:textSize="20sp"
                      android:textStyle="italic|bold" />
              </FrameLayout>
              <HorizontalScrollView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:scrollbars="none">
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <FrameLayout android:id="@+id/cardRutube" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="RUTUBE" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardVk" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="VK VIDEO" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardKinopoisk" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="КИНОПОИСК" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardYoutube" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="YOUTUBE" android:textColor="#FFFFFF" android:textStyle="bold" />
                      </FrameLayout>
                      <FrameLayout android:id="@+id/cardIncy" android:layout_width="150dp" android:layout_height="90dp" android:layout_marginEnd="16dp" android:background="@drawable/card_focus_selector" android:focusable="true">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:text="INCY VPN" android:textColor="#FFCC00" android:textStyle="bold" />
                      </FrameLayout>
                  </LinearLayout>
              </HorizontalScrollView>
          </LinearLayout>
          EOF

          # card_focus_selector.xml
          cat << 'EOF' > app/src/main/res/drawable/card_focus_selector.xml
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_focused="true">
                  <shape android:shape="rectangle">
                      <solid android:color="#222B38" />
                      <stroke android:width="3dp" android:color="#EA0029" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#141824" />
                      <stroke android:width="1dp" android:color="#333C4E" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
          </selector>
          EOF

          # banner_f1.xml
          cat << 'EOF' > app/src/main/res/drawable/banner_f1.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:angle="45" android:startColor="#0A0E17" android:centerColor="#151D2A" android:endColor="#EA0029" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.RBRLauncher" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#07090E</item>
              </style>
          </resources>
          EOF

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RedBullRacingLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
